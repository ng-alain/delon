name: CI

# on: push
on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  ACCESS_REPO: ${{ github.repository }}
  ACCESS_TOKEN: ${{ github.token }}
  PR_NUMBER: ${{ github.event.number }}
  SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
  SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
  CI_BUILD_NAME: ${{ secrets.CI_BUILD_NAME }}
  CI_BUILD_TOKEN: ${{ secrets.CI_BUILD_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Comment on github
        run: node ./scripts/github/comment.js "[Preview Preparing...](https://github.com/ng-alain/delon/actions/runs/${{ github.run_id }})"
        if: github.event.number
      - name: Install node modules
        run: pnpm install --frozen-lockfile
      - name: Build artifacts
        run: ./scripts/ci/build-artifacts.sh
        env:
          MESSAGE: ${{ github.event.pull_request.title || github.event.head_commit.message }}
      - name: Build site
        run: pnpm run site:build
      - name: 'Deploy Site'
        if: github.event.number
        run: |
          export DEPLOY_DOMAIN=https://preview-${{ github.event.number }}-ng-alain-delon.surge.sh
          echo "Deploy to $DEPLOY_DOMAIN"
          cp ./src/dist/browser/index.csr.html ./src/dist/browser/index.html
          cp ./src/dist/browser/index.csr.html ./src/dist/browser/404.html
          npx surge --project ./src/dist/browser --domain $DEPLOY_DOMAIN
      - name: 'Update comment on github'
        if: github.event.number
        run: |
          export DEPLOY_DOMAIN=https://preview-${{ github.event.number }}-ng-alain-delon.surge.sh
          node ./scripts/github/comment.js "[Preview is ready!]($DEPLOY_DOMAIN)"
      - name: 'When failed'
        if: github.event.number && failure()
        run: node ./scripts/github/comment.js "[Preview Build Failed!](https://github.com/ng-alain/delon/actions/runs/${{ github.run_id }})"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install node modules
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm run test
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./coverage/
          files: cobertura-coverage.xml
          fail_ci_if_error: true
          verbose: true

  test-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install node modules
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm run test:cli

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install node modules
        run: pnpm install --frozen-lockfile
      - name: Check code lint
        run: pnpm run lint
